name: doller_mobile
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  syncfusion_flutter_pdfviewer: ^33.2.13
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  sqflite_common_ffi: ^2.4.0+3
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - web/icons/Icon-512.png
    - assets/logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/logo.jpeg"
  image_path: "assets/logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpeg"
