server:
  port: 8089
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger - %msg%n"
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Dhaka}
management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:Asia/Dhaka}
  init:
    enabled: ${APP_INIT_ENABLED:false}
    bootstrap-token: ${APP_INIT_BOOTSTRAP_TOKEN:}
    owner-username: ${APP_INIT_OWNER_USERNAME:}
    owner-password: ${APP_INIT_OWNER_PASSWORD:}
  logging:
    trading-debug: ${APP_LOGGING_TRADING_DEBUG:false}
  security:
    docs-enabled: ${APP_SECURITY_DOCS_ENABLED:false}
  audit:
    store-payloads: ${APP_AUDIT_STORE_PAYLOADS:false}
  jwt:
    issuer: ${JWT_ISSUER}
    active-secret: ${JWT_ACTIVE_SECRET}
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    access-expiry-minutes: ${JWT_ACCESS_EXP_MIN:30}
    refresh-expiry-days: ${JWT_REFRESH_EXP_DAYS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
