spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  init:
    enabled: true
    bootstrap-token: test-bootstrap-token
  security:
    docs-enabled: false
  audit:
    store-payloads: false
  jwt:
    issuer: test-issuer
    active-secret: test-secret-test-secret-test-secret-test-secret
    previous-secret:
    access-expiry-minutes: 30
    refresh-expiry-days: 30
