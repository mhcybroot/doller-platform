name: Security CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode clean test

      - name: OWASP Dependency Check
        working-directory: backend
        run: mvn --batch-mode org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze
