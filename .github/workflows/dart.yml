name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 1. Get packages inside the mobile folder
      - run: flutter pub get
        working-directory: mobile

      # 2. Update pods inside mobile/ios
      - run: pod repo update
        working-directory: mobile/ios

      # 3. Build the iOS project
      - run: flutter build ios --release --no-codesign
        working-directory: mobile

      # 4. Create IPA (Paths are relative to the mobile/ directory now)
      - name: Prepare Payload
        run: |
          mkdir Payload
          mv Runner.app/ Payload
        working-directory: mobile/build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: mobile/build/ios/iphoneos

      # 5. Upload (Note the updated 'file' path)
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mobile/build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
